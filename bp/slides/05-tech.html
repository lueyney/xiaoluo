<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="deck.css"></head><body><section class="page dark"><div class="micro">LONG-FORM REWRITE ENGINE</div><h2 class="h2">我们把“自然表达”<br><span class="red">拆成一条可控制的管线</span></h2><div class="diagram"><div class="step"><b>01 / 句级拆分</b><span>把长文本变成可定位、可回滚的任务单元。</span></div><div class="step"><b>02 / 上下文</b><span>携带前序结果，避免相邻句式连续同构。</span></div><div class="step"><b>03 / 多策略</b><span>学术版、小说版、逐句和双句策略切换。</span></div><div class="step"><b>04 / 交付</b><span>模型路由、流式回显、失败兜底、DOCX 原位替换。</span></div></div><div class="evidence"><div><h3>不是同义词替换</h3><p>系统重构谓语、分句、节奏和连接方式，同时保留事实、观点、主体和专业术语。</p></div><div><h3>不是一次性吐出</h3><p>每个句段都能定位、追踪和回滚，最终结果可以继续编辑和导出。</p></div></div><div class="footer"><span>04 / 10</span><span>技术系统</span></div></section></body></html>
