    <!-- 手机号验证登录模态框 -->
    <div class="modal auth-modal" id="authModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="登录账户">
        <div class="modal-content auth-shell">
            <button class="modal-close" id="modalClose" type="button" aria-label="关闭登录窗口">
                <i class="fas fa-times"></i>
            </button>
            <aside class="auth-brand-panel" aria-hidden="true">
                <div class="auth-brand-signature">
                    <img class="auth-brand-logo" src="assets/xiaoluo-mark.svg" alt="">
                    <div class="auth-brand-name"><strong>AI小珞</strong><span>学术写作工作台</span></div>
                </div>
            </aside>

            <div class="auth-container">
                <!-- 登录表单 -->
                <form class="auth-form active" id="loginForm" aria-label="手机号验证码登录" novalidate>
                    <div class="auth-form-intro">
                        <h2>欢迎来到小珞</h2>
                        <p>验证手机号即可进入工作台，首次使用会自动创建账户</p>
                    </div>
                    <div class="form-group">
                        <label for="loginPhone">手机号</label>
                        <div class="auth-input-wrap auth-phone-input">
                            <span>+86</span>
                            <input type="tel" id="loginPhone" placeholder="请输入手机号" inputmode="numeric" autocomplete="username" maxlength="11" pattern="[0-9]{11}" aria-describedby="loginPhoneError" required>
                        </div>
                        <p class="auth-field-message" id="loginPhoneError" aria-live="polite"></p>
                    </div>
                    <div class="form-group" id="loginCodeGroup">
                        <label for="loginCode">验证码</label>
                        <div class="input-group auth-code-group">
                            <div class="auth-input-wrap"><i class="fas fa-shield-halved"></i><input type="text" id="loginCode" placeholder="请输入 6 位验证码" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="loginCodeError" required></div>
                            <button type="button" class="btn btn-secondary" id="sendLoginCodeBtn" aria-live="polite" aria-atomic="true">发送验证码</button>
                        </div>
                        <p class="auth-field-message" id="loginCodeError" aria-live="polite"></p>
                    </div>
                    <p class="auth-form-message" id="loginFormMessage" aria-live="polite"></p>
                    <button type="submit" class="btn btn-primary btn-block auth-submit" id="loginSubmitBtn">验证并进入工作台</button>
                    <p class="auth-legal">继续即表示你同意 <a href="#" onclick="return false;">用户协议</a> 与 <a href="#" onclick="return false;">隐私政策</a></p>
                </form>
            </div>
        </div>
    </div>
